# GDPR erasure demo — restore the non-compacted "orders" topic with the erasure
# list re-applied: records whose key is on the list are DROPPED (never produced).
# Consumer-group offset mapping stays exact — each dropped source offset maps to
# the next surviving record's target offset.
mode: restore
backup_id: "gdpr-demo"

target:
  bootstrap_servers:
    - kafka-broker-1:9092
  topics:
    include:
      - orders

storage:
  backend: s3
  bucket: kafka-backups
  endpoint: http://minio:9000
  path_style: true
  allow_http: true
  access_key: minioadmin
  secret_key: minioadmin

restore:
  create_topics: true
  topic_mapping:
    orders: orders-restored

enterprise:
  erasure:
    suppression:
      keys_file: /data/gdpr/suppressed-keys.txt
      topics: ["orders"]
      match: exact
      on_match: drop
